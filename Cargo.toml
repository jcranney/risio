[package]
name = "risio"
version = "0.1.3"
edition = "2024"
description = "Rust wrapper for ImageStreamIO library"
license = "Unlicense"
repository = "https://github.com/jcranney/risio"


[build-dependencies]
cmake = "0.1.58"
# bindgen = "0.72.1"

[dependencies]
anyhow = "1.0.102"
libc = "0.2.186"
memmap2 = "0.9.11"
rkyv = "0.8.16"
thiserror = "2.0.18"

[lib]
name = "risio"
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
rayon = "1.12.0"

[[bench]]
name = "bench"
harness = false
