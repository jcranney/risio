[package]
name = "risio"
version = "0.1.2"
edition = "2024"
description = "Rust wrapper for ImageStreamIO library"
license = "Unlicense"
repository = "https://github.com/jcranney/risio"


[build-dependencies]
cmake = "0.1.58"
bindgen = "0.72.1"

[dependencies]
anyhow = "1.0.102"
enum-iterator = "2.3.0"
libc = "0.2.186"
pyo3 = "0.29.0"
rustix = { version = "1.1.4", features = ["mm", "shm"] }
sem_safe = { version = "0.2.1", default-features = false, features = ["named"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "sync"] }

[lib]
name = "risio"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "risio-test"
